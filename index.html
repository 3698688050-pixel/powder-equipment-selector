<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>粉体设备高级预选型 - 极简开关版</title>
<style>
  /* =========================================================
     锤子 OS / Smartisan 方向：纸白 · 墨 · 朱砂
     单一强调色，其余全部灰阶；层级靠字号 / 字重 / 发丝线，
     不用阴影、不用渐变、不用发光。读数用等宽 tabular 数字。
     ========================================================= */
  :root {
    --paper: #FCFCFA;
    --ink: #17191C;
    --ink-2: #4A4C50;
    --muted: #82837E;
    --rule: #DFDFDA;
    --rule-soft: #ECECE7;
    --vermilion: #B63A2B;

    /* 旧变量名保留，避免内联样式失联 */
    --bg: var(--paper);
    --surface: transparent;
    --surface-hover: #ECECE7;
    --text-main: var(--ink);
    --text-sub: var(--muted);
    --line: var(--rule);
    --accent: var(--vermilion);
    --accent-glow: transparent;
    --danger: var(--vermilion);

    --radius: 4px;
    --shadow-out: none;
    --shadow-in: none;

    --num: "Bahnschrift", "DIN Alternate", "Segoe UI", -apple-system, sans-serif;
    --serif: "Songti SC", SimSun, "Noto Serif SC", serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background-color: var(--paper); color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    font-size: 15px; line-height: 1.65; font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased; padding: 36px 20px 72px;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  /* ── 页头：一条 2px 墨线，标题用宋体，不加色块 ───────────── */
  .header { padding: 0 0 10px; border-bottom: 2px solid var(--ink); }
  .header h1 {
    font-family: var(--serif); font-size: 24px; font-weight: 600;
    letter-spacing: .01em; color: var(--ink);
    display: flex; align-items: baseline; gap: 10px;
  }
  .header h1::before { content: none; }
  .mastnote {
    margin: 6px 0 0; font-size: 12px; line-height: 1.7;
    color: var(--muted); max-width: 46em;
  }

  /* ── 分区卡：无底色、无圆角、无阴影，只靠墨线分隔 ─────────── */
  .card {
    background: transparent; border: 0; border-radius: 0; box-shadow: none;
    margin: 30px 0 0; padding: 0; position: relative; overflow: visible;
  }

  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 0 0 9px; border-bottom: 1px solid var(--ink);
  }
  .card-title-wrap { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .card-num {
    font-family: var(--num); font-size: 11.5px; font-weight: 400;
    color: var(--vermilion); letter-spacing: .1em;
    background: none; padding: 0; border-radius: 0; flex: none;
  }
  .card-title {
    font-family: var(--serif); font-size: 16px; font-weight: 600;
    letter-spacing: .04em; color: var(--ink);
  }

  .card-body { padding: 16px 0 0; }

  /* ── 输入：底线式，像填好的表单，不是输入框 ──────────────── */
  .input-group { margin-bottom: 18px; }
  .input-group:last-child { margin-bottom: 0; }
  .input-label {
    display: block; font-size: 12.5px; font-weight: 400;
    color: var(--muted); letter-spacing: .05em; margin-bottom: 3px;
  }
  .input-field {
    width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; padding: 5px 0 7px; color: var(--ink);
    font-family: inherit; font-size: 15.5px; font-weight: 600;
    outline: none; transition: border-color .15s;
  }
  .input-field::placeholder { color: #B4B5B0; font-weight: 400; }
  .input-field:focus { border-bottom-color: var(--vermilion); }
  select.input-field {
    -webkit-appearance: none; appearance: none; cursor: pointer; padding-right: 22px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(-45deg, transparent 50%, var(--muted) 50%);
    background-position: calc(100% - 10px) 56%, calc(100% - 5px) 56%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select.input-field option { background: #fff; color: var(--ink); font-weight: 500; }

  /* ── 滑块：读数 38px 等宽；轨道 2px 发丝线 + 底部刻度 ─────── */
  .slider-container { margin-bottom: 22px; }
  .slider-container:last-child { margin-bottom: 0; }

  .slider-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 6px; }
  .slider-label { font-size: 12.5px; font-weight: 400; color: var(--muted); letter-spacing: .05em; }
  .slider-value-wrap { display: flex; align-items: baseline; gap: 6px; text-align: right; }

  .slider-value {
    font-family: var(--num); font-size: 38px; line-height: 1; font-weight: 500;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums;
    transition: color .1s; cursor: pointer;
    border-bottom: 1px solid transparent; padding-bottom: 1px;
  }
  .slider-value:hover { border-bottom-color: var(--rule); }

  .inline-input {
    font-family: var(--num); font-size: 38px; line-height: 1; font-weight: 500;
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); width: 120px; text-align: right; outline: none;
    border-radius: 0; padding: 0 2px 1px; -webkit-appearance: none;
    transition: border-color .15s;
  }
  .inline-input:focus { border-bottom-color: var(--vermilion); }
  /* 占位符按提示文字处理：若沿用 38px 读数尺寸，空字段会被误读成已有数值 */
  .inline-input::placeholder { color: #C2C3BD; font-size: 15px; font-weight: 400; letter-spacing: .02em; }

  .slider-unit { font-size: 12.5px; color: var(--muted); font-weight: 400; letter-spacing: .05em; margin-left: 0; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
    margin: 4px 0 0; background: transparent; cursor: pointer;
    background-image: repeating-linear-gradient(to right, var(--rule-soft) 0 1px, transparent 1px 10%);
    background-position: left bottom; background-size: 100% 7px; background-repeat: no-repeat;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 2px; cursor: pointer;
    background: var(--rule); border: 0; border-radius: 0; box-shadow: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
    background: var(--vermilion); border: 2px solid var(--paper); margin-top: -6px;
    box-shadow: 0 0 0 1px var(--vermilion); cursor: pointer;
    transition: transform .1s, background .15s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: none; background: var(--vermilion); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--rule); border: 0; }
  input[type=range]::-moz-range-thumb {
    height: 12px; width: 12px; border: 2px solid var(--paper); border-radius: 50%;
    background: var(--vermilion); box-shadow: 0 0 0 1px var(--vermilion);
  }

  .slider-ticks {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--muted); font-weight: 400;
    margin-top: 2px; padding: 0;
  }

  /* ── 分段控件（µm/目、D50…D100）：整块黑底做选中，不用药丸 ── */
  .unit-switch {
    display: flex; background: transparent; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0; overflow: hidden;
    box-shadow: none; flex: none;
  }
  .unit-switch button {
    flex: 1; padding: 6px 12px; border: 0; border-left: 1px solid var(--line);
    background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 400;
    color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .unit-switch button:first-child { border-left: 0; }
  .unit-switch button.on { background: var(--ink); color: var(--paper); font-weight: 600; }

  /* ── 主按钮：通体墨色，悬停才转朱砂 ──────────────────────── */
  .btn-primary {
    display: block; width: 100%; padding: 15px; border-radius: var(--radius);
    background: var(--ink); color: var(--paper); border: 0;
    font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: .09em;
    cursor: pointer; box-shadow: none; transition: background .15s;
    margin: 34px 0 0;
  }
  .btn-primary:hover { background: var(--vermilion); }
  .btn-primary:active { transform: none; background: var(--vermilion); }

  /* =========================================================
     工艺属性：双列勾选清单（18px 方框 + 朱砂打勾）
     ========================================================= */
  .switch-list {
    display: grid; grid-template-columns: 1fr 1fr;
    column-gap: 26px; row-gap: 0;
    border-top: 1px solid var(--rule-soft);
    border-bottom: 0;
  }

  .switch-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; min-height: 46px; padding: 0;
    border-bottom: 1px solid var(--rule-soft);
    cursor: pointer; transition: none;
  }
  .switch-row:last-child { border-bottom: 1px solid var(--rule-soft); }
  .switch-row:active { background: transparent; }

  .switch-label {
    font-size: 14px; font-weight: 400; color: var(--ink-2);
    letter-spacing: .01em; transition: color .12s;
  }

  /* 方框：默认只是 1px 浅线，勾选后才出现朱砂 */
  .switch-track {
    width: 18px; height: 18px; border-radius: 2px; flex: none;
    background: transparent; border: 1px solid #D3D3CB;
    position: relative; transition: background .12s, border-color .12s;
    box-shadow: none;
  }
  .switch-thumb { display: none; }

  .switch-row.on .switch-track { background: var(--vermilion); border-color: var(--vermilion); }
  .switch-row.on .switch-track::after {
    content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px;
    border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(42deg);
  }
  .switch-row.on .switch-label { color: var(--ink); font-weight: 600; }

  /* 易燃易爆：标签本身带朱砂，勾选后同样是朱砂框 */
  .switch-row[data-k="ex"].on .switch-track { background: var(--vermilion); }
  .switch-row[data-k="ex"].on .switch-label { color: var(--vermilion); }

  /* =========================================================
     结果区：规格表语言 —— 编号 / 型号 / 读数 / 理由
     ========================================================= */
  .res-header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 34px 0 0; padding: 0 0 8px;
    border-bottom: 1px solid var(--ink);
  }
  .res-header h2 {
    font-family: var(--serif); font-size: 16.5px; font-weight: 600;
    letter-spacing: .05em; color: var(--ink); margin: 0;
  }
  .res-header-meta {
    flex: none; font-size: 11.5px; font-weight: 400; color: var(--muted);
    letter-spacing: .05em; font-variant-numeric: tabular-nums; text-align: right;
  }

  .result-tag {
    flex: none; padding: 0; border: 0; border-radius: 0; background: none;
    font-family: var(--num); font-size: 20px; font-weight: 500; line-height: 1;
    letter-spacing: .01em; font-variant-numeric: tabular-nums;
    display: block; white-space: nowrap;
  }
  /* 匹配度是数据，不是装饰：全部用墨色；只有第 1 名那一个读数转朱砂 */
  .tag-red, .tag-yellow, .tag-green { color: var(--ink); }
  #out .card.top .result-tag { color: var(--vermilion); }

  .res-main-title {
    font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: .04em;
    color: var(--ink); margin-bottom: 4px; word-break: break-word;
  }
  .res-sub-title { font-size: 12.5px; color: var(--muted); letter-spacing: .05em; margin: 7px 0 15px; }
  /* 结果卡标题可能是很长的系列名，允许在词内断行，不要顶到右侧读数 */
  #out .card-title { word-break: break-word; }

  .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; }
  .res-item span {
    display: block; font-size: 11.5px; font-weight: 400; color: var(--muted);
    letter-spacing: .04em; margin-bottom: 3px;
  }
  .res-item b { display: block; font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.5; }
  /* 推荐理由与案例行是长句，退回正文字号，不做加粗强调 */
  .res-grid .res-item[style*="grid-column"] b { font-weight: 400; font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }

  .res-warn {
    margin-top: 18px; padding: 0 0 0 14px; border-radius: 0;
    border-left: 2px solid var(--vermilion); background: none;
    font-size: 13px; color: var(--ink-2); line-height: 1.75;
  }
  .res-warn b { color: var(--ink); font-weight: 600; }

  .res-opt {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    font-size: 12.5px; color: var(--muted); line-height: 1.75;
  }
  .res-opt b { color: var(--ink); font-weight: 600; }
  /* 案例最近邻无同物料时的提醒：朱砂竖线，不带底色 */
  .res-opt.res-note-warn {
    margin-top: 16px; padding: 2px 0 2px 14px; border-top: 0;
    border-left: 2px solid var(--vermilion); color: var(--ink-2);
  }
  .res-opt.res-note-warn b { color: var(--ink); }

  /* ── 案例清单：发丝线分隔，来源退到标题行右侧 ─────────────── */
  .case-list { margin-top: 0; }
  .case-item { padding: 14px 0 13px; border-top: 1px solid var(--rule-soft); }
  .case-head { display: flex; align-items: baseline; gap: 12px; }
  .case-title { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; line-height: 1.55; color: var(--ink); }
  .case-src { flex: none; font-size: 11.5px; color: var(--muted); letter-spacing: .06em; }
  .case-meta { margin-top: 2px; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .case-tag { font-size: 12.5px; line-height: 1.7; color: var(--ink-2); }
  .case-tag b { font-weight: 600; color: var(--ink); }

  /* 案例区引导句与脚注：正文语气，不做小标题 */
  .res-intro {
    margin: 0 0 2px; font-size: 13px; line-height: 1.75; color: var(--ink-2);
  }
  .case-warn {
    margin: 10px 0 0; padding: 2px 0 2px 14px;
    border-left: 2px solid var(--vermilion);
    font-size: 12.5px; line-height: 1.75; color: var(--ink-2);
  }
  .case-warn b { display: block; font-weight: 600; color: var(--ink); }
  .case-notes {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    font-size: 12.5px; line-height: 1.8; color: var(--muted);
  }
  .case-notes p + p { margin-top: 7px; }
  .case-notes b { font-weight: 600; color: var(--ink-2); }

  /* 案例佐证：一个标签、每族一行，同名句式只说一次 */
  .ev { margin: 0 0 13px; }
  .ev-head { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
  .ev-row { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; line-height: 1.75; }
  .ev-row b { font-weight: 600; color: var(--ink-2); }
  .ev-row span { color: var(--muted); }
  .ev-row.none span { color: var(--ink-2); }
  @media (max-width: 560px) {
    .ev-row { grid-template-columns: 4.4em 1fr; gap: 8px; }
  }

  .empty-state { text-align: center; padding: 36px 0; }
  .empty-state h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 6px; letter-spacing: .04em; }
  .empty-state p { font-size: 13px; color: var(--muted); line-height: 1.75; }

  /* 结果卡：读数已进 flex 流，只需控制节奏 */
  #out .card { margin-top: 26px; }
  /* 排名标记：「第/名」弱化，名次数字是唯一的强调色 */
  .card-num i { font-style: normal; color: var(--muted); letter-spacing: .04em; margin-right: 3px; }
  .card-num i:last-child { margin-right: 0; margin-left: 1px; }
  #out .card-num { font-size: 12px; letter-spacing: .04em; color: var(--muted); }

  /* ── 窄屏 ────────────────────────────────────────────── */
  @media (max-width: 560px) {
    body { padding: 24px 16px 56px; }
    .header h1 { font-size: 21px; }
    .card { margin-top: 26px; }
    .switch-list { grid-template-columns: 1fr; }
    .switch-row { min-height: 44px; }
    .slider-value, .inline-input { font-size: 32px; }
    .res-grid { grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .res-header { margin-top: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>粉体预选型</h1>
    <p class="mastnote">填物料、产能、粒度与工艺属性，按粒度、产能、工艺链、分级精度和案例先验加权排序。</p>
  </div>

  <!-- 01 基础信息 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title-wrap"><span class="card-num">01</span><span class="card-title">物料与产能</span></div>
    </div>
    <div class="card-body">
      <div class="input-group">
        <label class="input-label">物料名称（自动匹配）</label>
        <input id="mat" class="input-field" type="text" list="matList" placeholder="输入物料名称，如 石英..." autocomplete="off">
        <datalist id="matList"></datalist>
      </div>
      <div class="input-group">
        <label class="input-label">物料类别</label>
        <select id="cat" class="input-field">
          <option value="">请选择类别</option>
          <option value="mineral">非金属矿</option>
          <option value="hard">硬质矿物 / 高硅</option>
          <option value="battery">电池材料</option>
          <option value="pharma">医药 / 原料药</option>
          <option value="food">食品 / 保健品</option>
          <option value="chem">化工 / 颜料</option>
          <option value="herb">中药 / 植物纤维</option>
          <option value="metal">金属粉末</option>
          <option value="waste">固废 / 粉煤灰</option>
          <option value="other">其他</option>
        </select>
      </div>
      
      <!-- 产能滑块 -->
      <div class="slider-container">
        <div class="slider-header">
          <span class="slider-label">目标产能</span>
          <div class="slider-value-wrap">
            <span class="slider-value" id="capDisplay" style="color: var(--accent);">500</span>
            <span class="slider-unit">kg/h</span>
          </div>
        </div>
        <input type="range" id="capSlider" min="10" max="10000" step="10" value="500">
        <div class="slider-ticks"><span>10</span><span>2,500</span><span>5,000</span><span>10,000 kg/h</span></div>
      </div>
    </div>
  </div>

  <!-- 02 粒度标准 -->
  <div class="card">
    <div class="card-head">
      <div class="card-title-wrap"><span class="card-num">02</span><span class="card-title">粒度标准</span></div>
      <div class="unit-switch" id="unitSwitch">
        <button class="on" data-u="um">µm</button>
        <button data-u="mesh">目</button>
      </div>
    </div>
    <div class="card-body">
      
      <!-- 粒度滑块 -->
      <div class="slider-container">
        <div class="slider-header">
          <span class="slider-label">目标粒度</span>
          <div class="slider-value-wrap">
            <span class="slider-value" id="sizeDisplay" style="color: var(--accent);">45</span>
            <span class="slider-unit" id="sizeUnitLabel">µm</span>
          </div>
        </div>
        <input type="range" id="sizeSlider" min="1" max="500" step="1" value="45">
        <div class="slider-ticks" id="sizeTicks"><span>1</span><span>100</span><span>300</span><span>500</span></div>
      </div>

      <div class="unit-switch" style="width: 100%; margin-top: 18px;">
        <button style="flex:1" data-v="D50" class="on">D50</button>
        <button style="flex:1" data-v="D90">D90</button>
        <button style="flex:1" data-v="D97">D97</button>
        <button style="flex:1" data-v="D99">D99</button>
        <button style="flex:1" data-v="D100">D100</button>
      </div>

      <!-- 入料粒度（可选）：给了才算粉碎比，才能用上「分级只切分布、不造细」这条判据 -->
      <div class="slider-container" style="margin-top: 18px;">
        <div class="slider-header">
          <span class="slider-label">入料粒度 <span style="opacity:.5;font-weight:400;">（可选）</span></span>
          <div class="slider-value-wrap">
            <input id="feedInput" type="text" inputmode="decimal" placeholder="如 1000" class="inline-input" style="width:120px;">
            <span class="slider-unit">µm</span>
          </div>
        </div>
        <div class="slider-ticks" style="margin-top: 8px;"><span>不确定就不填，粉碎比按中性处理</span></div>
      </div>
    </div>
  </div>

  <!-- 03 工艺属性 -->

/* ============ 动画与颜色逻辑 ============ */
function getDynamicColor(val, min, max) {
  // 锤子 OS 方向：只有一个朱砂色相，只调明度/饱和度做强弱，不做蓝→品红的扫色
  let p = Math.max(0, Math.min(1, (val - min) / (max - min)));
  return `hsl(8, ${62 + p * 8}%, ${44 - p * 9}%)`;
}

function animateNumber(el, targetVal, min, max) {
  const currentVal = parseFloat(el.innerText.replace(/,/g, '')) || 0;
  if (currentVal === targetVal) return;
  const duration = 200;
  const startTime = performance.now();
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    let progress = Math.min(elapsed / duration, 1);
    progress = progress * (2 - progress);
    const current = currentVal + (targetVal - currentVal) * progress;
    let displayStr = targetVal > 1000 ? Math.round(current).toLocaleString() : Math.round(current);
    if (targetVal > 1000 && current < 1000) displayStr = Math.round(current);
    el.innerText = displayStr;
    el.style.color = getDynamicColor(current, min, max);
    if (progress < 1) requestAnimationFrame(update);
    else {
      el.innerText = targetVal > 1000 ? targetVal.toLocaleString() : targetVal;
      el.style.color = getDynamicColor(targetVal, min, max);
    }
  }
  requestAnimationFrame(update);
}

/* ============ 点击数字编辑功能 ============ */
function makeEditable(displayEl, sliderEl, min, max, isMesh) {
  displayEl.addEventListener('click', function() {
    if (this.tagName === 'INPUT') return;
    const rawValue = this.innerText.replace(/,/g, '');
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.className = 'inline-input';
    input.value = rawValue;
    this.parentNode.replaceChild(input, this);
    input.focus();
    input.select();
    const commit = () => {
      let val = parseFloat(input.value.replace(/,/g, ''));
      if (isNaN(val)) val = parseFloat(sliderEl.value);
      if (val < min) val = min;
      if (val > max) val = max;
      sliderEl.value = val;
      sliderEl.dispatchEvent(new Event('input'));
      const span = document.createElement('span');
      span.id = displayEl.id;
      span.className = 'slider-value';
      span.innerText = val > 1000 ? val.toLocaleString() : val;
      span.style.color = getDynamicColor(val, min, max);
      input.parentNode.replaceChild(span, input);
      makeEditable(span, sliderEl, min, max, isMesh);
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  });
}

/* ============ 物料联动（v5 物料库） ============ */
function compactStr(x){ return String(x||'').replace(/\s+/g,'').toLowerCase(); }
function lookupMaterial(raw){
  const s=String(raw||'').trim();
  if(!s) return null;
  const q=compactStr(s);
  const eq=a=>compactStr(a)===q;
  const inc=a=>compactStr(a).includes(q);
  const hasCJK=/[\u4e00-\u9fff]/.test(s);
  for(const m of DATA_MATERIALS){
    if(eq(m.n)||eq(m.cas)||eq(m.en)) return m;
    if((m.alias||[]).some(eq)) return m;
  }
  for(const m of DATA_MATERIALS){
    if(q.length>=2&&inc(m.n)) return m;
    if(q.length>=2&&(m.alias||[]).some(inc)) return m;
    if(q.length>=3&&inc(m.en)) return m;
  }
  if(hasCJK&&q.length>2){
    const cores=[];
    if(q.endsWith('粉')) cores.push(q.slice(0,-1));
    if(q.endsWith('石')) cores.push(q.slice(0,-1));
    if(q.endsWith('土')) cores.push(q.slice(0,-1));
    for(const core of cores){
      if(core.length<2) continue;
      const eqc=a=>compactStr(a)===core;
      const incc=a=>compactStr(a).includes(core);
      for(const m of DATA_MATERIALS){
        if(eqc(m.n)||(m.alias||[]).some(eqc)) return m;
      }
      for(const m of DATA_MATERIALS){
        if(incc(m.n)) return m;
        if((m.alias||[]).some(incc)) return m;
      }
    }
  }
  return null;
}

function parseNum(s){ if(s==null||s==='') return null; const m=String(s).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):null; }

const MESH_UM={10:2000,16:1180,20:850,30:600,40:425,50:300,60:250,70:212,80:180,100:150,120:125,140:106,170:90,200:75,230:63,270:53,325:45,400:38,500:25,635:20,800:15,1000:13,1250:10,2500:5,5000:2.5};
function meshToUm(mesh){

  return 15000/mesh;

function parseDevSizeRanges(s){
  if(!s) return {type:'generic',ranges:[]};
  const out=[];
  const push=(min,max)=>{ if(min!=null&&max!=null&&min<=max) out.push({min,max}); };
  let re=/D97[:：]?\s*(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)/gi, m;
  while((m=re.exec(s))) push(parseFloat(m[1]),parseFloat(m[2]));
  if(out.length) return {type:'D97',ranges:out};
  re=/D50[:：]?\s*(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)/gi;
  while((m=re.exec(s))) push(parseFloat(m[1]),parseFloat(m[2]));
  if(out.length) return {type:'D50',ranges:out};
  re=/(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)\s*(?:μm|um|µm|微米)/gi;
  while((m=re.exec(s))) push(parseFloat(m[1]),parseFloat(m[2]));
  return {type:'generic',ranges:out};
}

function parseDevCaps(s){
  if(!s) return {ranges:[],values:[]};
  const ranges=[], values=[];
  let m,re=/(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)\s*(kg\/h|t\/h|g\/h|kgH2O\/h)?/gi;
  const consumed=[];
  while((m=re.exec(s))){
    const a=parseFloat(m[1]), b=parseFloat(m[2]); const u=(m[3]||'kg/h').toLowerCase();
    let x=a,y=b; if(u==='t/h'){x*=1000;y*=1000;} if(u==='g/h'){x/=1000;y/=1000;}
    if(x<=y) ranges.push({min:x,max:y});
    consumed.push([m.index, m.index+m[0].length]);
  }
  const arr=Array.from(s);
  for(const [a,b] of consumed){ for(let i=a;i<b;i++) arr[i]=' '; }
  const work=arr.join('');
  re=/(\d+(?:\.\d+)?)\s*(kg\/h|t\/h|g\/h)/gi;
  while((m=re.exec(work))){
    const v=parseFloat(m[1]); const u=m[2].toLowerCase();
    let x=v; if(u==='t/h')x*=1000; if(u==='g/h')x/=1000;
    values.push(x);
  }
  return {ranges,values};
}

function devHardnessMax(feat){
  if(!feat) return null;
  let m=feat.match(/莫氏硬度\s*(\d+(?:\.\d+)?)\s*以下/);
  if(!m) m=feat.match(/硬度\s*(\d+(?:\.\d+)?)\s*级?以下/);
  if(!m) m=feat.match(/(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)\s*以下/);
  if(m) return parseFloat(m[1]);
  return null;
}

function splitModels(mField){
  if(!mField) return [];
  const raw=String(mField).split(/[;；]/)
    .map(s=>s.trim().replace(/[（(].*?[)）]/g,'').trim())
    .filter(Boolean);
  const good=raw.filter(s=>!/系列|型号/.test(s)||/\d/.test(s));
  return good;
}

function parseModelParams(capField, sizeField, models){
  const caps={}, sizes={};
  let capByModel=false, sizeByModel=false;
  const isModel=(s)=>models.indexOf(s)>=0;
  String(capField||'').split(/[;；]/).forEach(seg=>{
    seg=seg.trim(); if(!seg) return;
    const idx=seg.indexOf(':');
    if(idx>0 && isModel(seg.slice(0,idx).trim())){
      capByModel=true; caps[seg.slice(0,idx).trim()]=parseDevCaps(seg.slice(idx+1).trim());
    } else if(!caps['__all']) caps['__all']=parseDevCaps(seg);
  });
  String(sizeField||'').split(/[;；]/).forEach(seg=>{
    seg=seg.trim(); if(!seg) return;
    const idx=seg.indexOf(':');
    if(idx>0 && isModel(seg.slice(0,idx).trim())){
      sizeByModel=true; sizes[seg.slice(0,idx).trim()]=parseDevSizeRanges(seg.slice(idx+1).trim());
    } else if(!sizes['__all']) sizes['__all']=parseDevSizeRanges(seg);
  });
  return {caps, sizes, capByModel, sizeByModel};
}

function pickModel(dev, targetCap, sizeInfo){
  const models=splitModels(dev.m);
  if(!models.length) return {model:null, note:'该系列未提供具体型号，请咨询工程师'};
  const {caps, sizes, capByModel, sizeByModel}=parseModelParams(dev.cap, dev.size, models);
  const targetUm=sizeInfo? sizeInfo.um : null;
  let best=null;
  for(const model of models){
    const c=caps[model]||caps['__all']||null;
    const s=sizes[model]||sizes['__all']||null;
    let capScore=0, sizeScore=0;
    if(c && targetCap!=null){
      let hit=false, gap=Infinity;
      for(const r of c.ranges){ if(targetCap>=r.min&&targetCap<=r.max){hit=true;break;} }
      if(hit) capScore=1;
      else{
        for(const r of c.ranges){ const g=r.min>targetCap?(r.min-targetCap)/r.min:(targetCap-r.max)/r.max; if(g<gap) gap=g; }
        for(const v of c.values){ const g=Math.abs(targetCap-v)/v; if(g<gap) gap=g; }
        capScore= gap<0.5?0.5 : (gap<1?0.2:0);
      }
    }
    if(s && targetUm!=null){
      let hit=false;
      for(const r of s.ranges){ if(targetUm>=r.min&&targetUm<=r.max){hit=true;break;} }
      if(hit) sizeScore=1;
      else{
        let gap=Infinity;
        for(const r of s.ranges){ const g=r.min>targetUm?(r.min-targetUm)/r.min:(targetUm-r.max)/r.max; if(g<gap) gap=g; }
        sizeScore= gap<0.5?0.5 : (gap<1?0.2:0);
      }
    }
    const score=capScore*0.6+sizeScore*0.4;
    if(best==null||score>best.score) best={model, score, capScore, sizeScore};
  }
  if(!best) return {model:null, note:'型号参数解析失败'};
  let note='';
  if(!capByModel&&!sizeByModel) note='该系列未按型号细分参数，默认推荐基础档位';
  else if(!capByModel) note='该系列未按型号标注产能，默认推荐基础档位';
  else if(best.capScore<1) note='已选目标产能最接近的档位';
  return {model:best.model, note};
}

function cleanPhrase(s){
  if(!s) return '';
  return String(s)
    .replace(/[（(][^）)]*[)）]/g,'')
    .replace(/\d+(?:\.\d+)?\s*(?:μm|um|µm|微米|目|mesh|kg\/h|t\/h|g\/h|kW|rpm|mm|MPa|℃|°C|级|系列|型号|型)?/gi,'')
    .replace(/[；;：:]+/g,'，')
    .replace(/[，,]{2,}/g,'，')
    .replace(/^[，,]+|[，,]+$/g,'')
    .trim();
}

function cleanSell(sell){
  if(!sell) return '';
  return String(sell)
    .split(/[，,；;。]/)
    .map(s=>s.trim())
    .filter(s=> s && !/\d/.test(s) && !/[~～≤<>=·]/.test(s) && !/(mg|dB|m\/s|kW|rpm|μm|um|µm|微米|目|mesh|MPa|℃|°C)/i.test(s))
    .join('，');
}

function makeReason(it, rank){
  const s=it.s||{};
  const p=v=>Math.round((v||0)*100)+'%';
  if(s.A==null) return '按设备资料推荐，具体参数请结合工程师建议复核。';
  const bits=[];
  bits.push('粒度匹配 '+p(s.A)+(s.sizeModel?'（'+s.sizeModel+'）':'')+(s.sizeUnknown?' · 族级估值':''));
  bits.push('产能匹配 '+p(s.B)+(s.units>1?'（'+s.units+' 台并联）':'')+(s.capUnknown?' · 族级估值':''));
  if(it.ratio!=null) bits.push('粉碎比 '+(+it.ratio.toFixed(1))+'（'+p(s.D)+'）');
  bits.push('分级精度 '+p(s.H));
  bits.push('案例先验 '+(s.fam&&s.fam.super?s.fam.super+' ':'')+(s.P||0).toFixed(2));
  const head=rank===1?'最符合':rank===2?'次选':'备选';
  return head+' · '+bits.join(' · ');
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============ 案例库检索（回灌层） ============
   案例来源：ALPA 官网中文站 99 例 + 英文站 64 例（docs/案例库回灌-分批迭代报告.md）。
   作用：设备排序之外，再给出一组「真实成交工况」作为佐证/反证，避免只凭打分排序下结论。
   注意：检索是 1:1 最近邻，已知案例必然命中自身；它证明的是「案例能被找回」，
        不等于「设备排序全对」（排序指标见回放脚本，Top3≈78%，见报告 §4）。 */
const CASE_SUPER_NAME = { '气流磨': '气流磨', '机械磨': '机械粉碎', '分级': '分级机', '球磨线': '球磨线', '改性': '改性/打散', '实验室': '实验室机', '蒸汽': '蒸汽动能磨' };

/* 设备 → 设备族（与 tools/kb.js devFamily 同规则） */
function devSuperOf(d) {
  const n = d.n, c = d.c;
  if (c === '辅助设备') return '辅助';
  if (c === '改性机') return '改性';
  if (c === '实验室设备') return '实验室';
  if (c === '球磨分级生产线') return '球磨线';
  if (c === '分级机') return '分级';
  if (/蒸汽/.test(n)) return '蒸汽';
  if (/MQP01|MZL|MZW|MQL|MQW|MQPW|MQP/.test(n)) return '气流磨';
  if (/MZ|CUM|ULM|RTM|TSM|CSM/.test(n)) return '机械磨';
  if (c === '机械粉碎') return '机械磨';
  if (c === '气流粉碎') return '气流磨';
  return '其他';
}

const _CASE_ROWS = DATA_CASES.map(r => ({
  site: r[0], title: r[1], ind: r[2], material: r[3], cap: r[4], feed: r[5], prod: r[6],
  basis: r[7], supers: String(r[8]).split('+').filter(Boolean), famLabel: r[9],
  ratio: r[5] > 0 && r[6] > 0 ? r[5] / r[6] : null
}));

/* 物料名 → 归一到没找到就返回 null，用来判断「是不是同一种料」 */
const _MAT_IDX = (() => {
  const idx = new Map();
  for (const m of DATA_MATERIALS) {
    idx.set(m.n, m);
    for (const a of (m.alias || [])) if (a) idx.set(a, m);
  }
  return idx;
})();
function matEntry(name) {
  const t = String(name || '').trim();
  if (!t) return null;
  if (_MAT_IDX.has(t)) return _MAT_IDX.get(t);
  for (const [k, v] of _MAT_IDX) if (k.length >= 2 && (t.includes(k) || k.includes(t))) return v;
  return null;
}
function matTokens(txt) { return String(txt || '').split(/[、,，/;；·\s]+/).map(s => s.trim()).filter(s => s.length >= 2); }

/* 物料相似度：0 同一种料 / 0.4 同类别 / 1 无关 */
function matAffinity(inputName, caseMaterial) {
  const a = matEntry(inputName);
  const toks = matTokens(caseMaterial);
  for (const t of toks) {
    if (inputName && (t === inputName || t.includes(inputName) || inputName.includes(t))) return 0;
    const b = matEntry(t);
    if (a && b && a === b) return 0;
  }
  if (a) for (const t of toks) { const b = matEntry(t); if (b && b.cat === a.cat) return 0.4; }
  return 1;
}

const _lg = v => Math.log(v > 0 ? v : 1);
/* 案例成品粒度换算到 D97 当量（与 tools/fit.js ctxOf 同口径） */
const _d97 = (um, basis) => { const b = String(basis || '').replace(/^D/, ''); return um * (b === '50' ? 2.5 : b === '90' || b === '95' ? 1.2 : b === '99' || b === '100' ? 0.9 : 1); };
function _gap(a, b) { return (a > 0 && b > 0) ? Math.abs(_lg(a / b)) : 0; }

/* 返回与当前工况最接近的案例（分数越小越近） */
function matchCases(input, k) {
  const target = input.um * (input.basis === 'D50' ? 2.5 : input.basis === 'D90' ? 1.2 : input.basis === 'D95' ? 1.2 : input.basis === 'D99' ? 0.9 : input.basis === 'D100' ? 0.9 : 1);
  const rows = _CASE_ROWS.map(c => {
    const dMat = matAffinity(input.name, c.material);
    const dSize = _gap(target, _d97(c.prod, c.basis));
    const dCap = _gap(input.cap, c.cap);
    const dRatio = (input.feed > 0 && c.ratio) ? _gap(input.feed / input.um, c.ratio) : 0;
    // 物料不一致的代价要大于「粒度+产能+粉碎比」三项惩罚之和的上限，
    // 否则会拿"粒度产能刚好相近的别家物料案例"当最近邻（磷酸铁锂 500kg/h 被判给锡粉案例就是这种情况）。
    const dist = dMat * 1.5 + Math.min(dSize * 0.9, 1.5) + Math.min(dCap * 0.35, 1.2) + Math.min(dRatio * 0.25, 1.0);
    return { c, dist, dMat, dSize, dCap };
  });
  rows.sort((x, y) => x.dist - y.dist);
  return rows.slice(0, k || 5);
}

const _fmtCap = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + ' t/h' : Math.round(v) + ' kg/h';
/* 案例成品粒度常带三位小数（29.129），展示统一收到 1 位，不制造虚假精度 */
const _fmtProd = v => { const n = +v; return Number.isFinite(n) ? String(Math.round(n * 10) / 10) : String(v); };
const _escape = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* 结果区里的「参考案例 + 案例佐证」 */
function caseSectionHtml(items, ctx) {
  const input = { name: ctx.name || '', um: ctx.sizeInfo.um, basis: ctx.sizeInfo.key, feed: ctx.feedUm || 0, cap: ctx.cap };
  const picks = matchCases(input, 5);
  if (!picks.length) return '';

  // 案例佐证：近 20 例里，与该设备族一致的案例数。同族的多名候选合并成一条，
  // 否则 Top1/Top2/Top3 同族时会重复三遍一模一样的话。
  const near = matchCases(input, 20);
  const badge = [];
  items.forEach((it, i) => {
    const sup = devSuperOf(it.dev);
    const hit = near.filter(p => p.c.supers.includes(sup));
    const got = badge.find(b => b.sup === sup);
    if (got) got.ranks.push(i + 1);
    else badge.push({ sup, ranks: [i + 1], n: hit.length, eg: hit[0] && hit[0].c });
  });

  const rows = picks.map(p => {
    const c = p.c;
    const why = [];
    if (p.dMat === 0) why.push('同物料');
    else if (p.dMat < 0.5) why.push('同物料类别');
    if (p.dSize < 0.12) why.push('粒度相当');
    if (p.dCap < 0.25) why.push('产能相当');
    return `<div class="case-item">
        <div class="case-head">
          <span class="case-title">${_escape(c.title)}</span>
          <span class="case-src">${c.site === 'C' ? '中文站' : '英文站'}</span>
        </div>
        <div class="case-meta">${_escape(c.material)}，${_fmtCap(c.cap)}，成品 ${_fmtProd(c.prod)} μm（${_escape(c.basis)}）${c.ratio ? '，粉碎比 ' + (c.ratio >= 10 ? Math.round(c.ratio) : c.ratio.toFixed(1)) : ''}</div>
        <div class="case-tag">官方标注族 <b>${c.supers.map(s => CASE_SUPER_NAME[s] || s).join(' + ')}</b>${c.famLabel ? '（' + _escape(c.famLabel) + '）' : ''}${why.length ? '，' + why.join('、') : ''}</div>
      </div>`;
  }).join('');

  const badgeRows = badge.map(b => {
    const supName = CASE_SUPER_NAME[b.sup] || b.sup;
    const where = b.ranks.length === 1 ? `排序第 ${b.ranks[0]} 位` : `排序第 ${b.ranks.join('、')} 位`;
    const n = b.ranks.length;
    if (!b.n) return `<div class="ev-row none"><b>${supName}</b><span>${where}，近邻案例里没有这条路线，按上面的案例族复核</span></div>`;
    return `<div class="ev-row"><b>${supName}</b><span>${where}，近邻案例里有 ${n} 例${b.eg ? '，如 ' + _escape(b.eg.title) : ''}</span></div>`;
  }).join('');
  const badgeHtml = badge.length ? `<div class="ev"><div class="ev-head">案例佐证</div>${badgeRows}</div>` : '';

  // 案例库里找不到相近物料时，最近邻只是「粒度产能碰巧接近」，参考价值很低，必须说出来

}

/* ============ 结果渲染（复用 1.html CSS 类） ============ */
function renderTop3(items, ctx){
  if(!items.length){
    outEl.innerHTML = `
      <div class="card" style="padding: 0;">
        <div class="empty-state">
          <h3>未找到匹配机型</h3>
          <p>当前工艺组合超出常规物理界限。<br>建议联系工程师安排物料小试后定制专机。</p>
        </div>
      </div>`;
    return;
  }

  let warningHtml = '';
  if (ctx.attrs.includes('quartz') || ctx.attrs.includes('hard')) {
    warningHtml += `<div class="res-warn"><b>磨蚀性极强</b>　严禁使用普通钢衬板。推荐配置：高铬合金耐磨衬板、高铬钢球、管道除铁器。</div>`;
  }
  if (ctx.attrs.includes('ex')) {
    warningHtml += `<div class="res-warn"><b>防爆强制要求</b>　物料具有易燃易爆属性，系统必须配备防爆电机、全密闭氮气循环、静电接地与在线氧含量监测。</div>`;
  }

  // 引擎在系列未拆型号时会把粒度区间当“型号”返回，不能当型号展示
  const isModelName = m => !!m && !/^(D\d{2,3}|[<>≤≥])/i.test(m) && !/μm|um\b|目/.test(m);
  const seriesSpan = d => {
    const list = String(d.m || '').split(';').map(s => s.replace(/[:：].*$/, '').trim()).filter(Boolean);
    if (list.length < 2) return '';
    return `${list[0]}–${list[list.length - 1]}`;
  };
  const fmtNum = v => (v == null || v === '') ? '' : (+v > 1000 ? Math.round(v).toLocaleString() : String(Math.round(v * 10) / 10));

  const cards = items.map((it,idx)=>{
    const d=it.dev;
    const pm=pickModel(d, ctx.cap, ctx.sizeInfo);
    // 引擎已按型号级联合打分选出型号（capModel/sizeModel），优先用它，保证「打分的型号」和「展示的型号」是同一台
    const model=it.model ? it.model : (pm.model ? pm.model : '');
    const span=seriesSpan(d);
    const modelCell = isModelName(model) ? esc(model)
      : (span ? `系列 ${span}` : '按工况定');
    const pct=Math.min(99, Math.max(35, Math.round(it.total)));
    const tagCls = pct>=80?'tag-green':(pct>=60?'tag-yellow':'tag-red');
    const rs=parseDevSizeRanges(d.size);
    const sizeTxt = rs.ranges.length ? (rs.type==='D97'?'D97 ': rs.type==='D50'?'D50 ':'') + rs.ranges[0].min+'–'+rs.ranges[0].max+' µm' : '见产品样册';
    const candNote = ctx.isCandidate ? `<div class="res-opt"><b>提示</b><br>候选设备，存在未完全满足项，请结合工程师建议评估。</div>` : '';
    return `
      <div class="card${idx===0?' top':''}">
        <div class="card-body" style="padding-top: 0;">
          <div class="card-head" style="padding: 0 0 8px;">
            <div class="card-title-wrap"><span class="card-num"><i>第</i>${idx+1}<i>名</i></span><span class="card-title">${esc(d.n)}</span></div>
            <div class="result-tag ${tagCls}">${pct}%</div>
          </div>
          <div class="res-sub-title">${esc(d.c)}</div>
          <div class="res-grid">
            <div class="res-item"><span>推荐型号</span><b>${modelCell}</b></div>
            <div class="res-item"><span>可达粒度</span><b>${sizeTxt}</b></div>
            <div class="res-item" style="grid-column: 1 / -1;"><span>推荐理由</span><b>${esc(makeReason(it,idx+1))}</b></div>
          </div>
          ${pm.note? `<div class="res-opt"><b>备注</b><br>${esc(pm.note)}</div>`:''}
          ${candNote}
        </div>
      </div>`;
  }).join('');

  const headMeta = [ctx.name, ctx.sizeInfo && `${ctx.sizeInfo.key} ${fmtNum(ctx.sizeInfo.um)} µm`, `${fmtNum(ctx.cap)} kg/h`]
    .filter(Boolean).join('，');
  outEl.innerHTML = `<div class="res-header"><h2>智能匹配结果</h2><span class="res-header-meta">${esc(headMeta)}</span></div>${warningHtml}${cards}` + caseSectionHtml(items, ctx);
}

$('go').addEventListener('click', evaluate);

// 初始化颜色
capDisplay.style.color = getDynamicColor(500, 10, 10000);
sizeDisplay.style.color = getDynamicColor(45, 1, 500);
</script>
